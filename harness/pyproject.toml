[project]
name = "incident-harness"
version = "0.1.0"
description = "Local incident-repair experiment harness"
requires-python = ">=3.13,<3.14"
dependencies = ["confluent-kafka==2.15.0", "httpx==0.28.1"]

[project.scripts]
incident-harness = "incident_harness:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_harness"]
