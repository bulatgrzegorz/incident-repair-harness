apiVersion: 1

groups:
  - orgId: 1
    name: product-worker
    folder: Incident Repair Harness
    interval: 10s
    rules:
      - uid: product-worker-blocked
        title: Product worker processing failures with consumer lag
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 60
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: (product_processing_failures_total >= 3) and on(service_namespace, service_instance_id) (product_consumer_lag > 0) and on(service_namespace, service_instance_id) (product_processing_successes_total == 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Processing failures are increasing while consumer lag remains positive and successes remain flat.
          metric: product_processing_failures_total
          code_path: src/ProductWorker
        labels:
          service: product-worker
          severity: critical
